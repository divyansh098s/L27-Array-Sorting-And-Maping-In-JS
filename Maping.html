<!DOCTYPE html>
<html>
<head>
<title>Mapping</title>
</head>
<body>
<p>Multiply Every Element In The Array With 10 : </p>
<p id="product"></p>
<script>
var numbers = [36,69,98,87,74,41,12,23,0];
function myFunction(num){
return num * 10;
}
var newarray = numbers.map(myFunction);
document.getElementById("product").innerHTML = newarray;
</script>
</body>
</html>
